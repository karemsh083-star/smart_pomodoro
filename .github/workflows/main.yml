name: Build Smart Pomodoro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Structure
        run: mkdir -p lib

      - name: Move Source File
        run: |
          if [ -f "main.dart" ]; then mv main.dart lib/main.dart; fi
          if [ -f "main.dart.txt" ]; then mv main.dart.txt lib/main.dart; fi

      - name: Create Android Folder
        run: mkdir -p android/app/src/main

      - name: Move Manifest File
        run: |
          if [ -f "AndroidManifest.xml" ]; then mv AndroidManifest.xml android/app/src/main/AndroidManifest.xml; fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Pomodoro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
